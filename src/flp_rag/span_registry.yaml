# The span registry of issue #29: the one list of every span, its kind, its parent, the request
# paths it exists on, and its attributes. `span_registry.py` loads it; `tests/test_span_tree.py`
# checks every path against it; `eval/trace_coverage.py` checks live traces against it;
# `tracing.py` reads the sentinels and the content keys. Spec Sections 7.4, 7.5, 7.6 follow it.
version: 1

limits:
  text_chars: 1000        # a `rag.*` text value is cut here and ends with the marker
  json_chars: 4000        # a JSON attribute (list or record) is cut here
  truncated_marker: "…(truncated)"

sentinels:                # open question 2: a missing value is a sentinel, never null
  number: -1
  text: none

# Attributes that hold user text or book text. Present only when `trace.capture_content` is
# true (Part 6). `*.document.content` is matched by suffix. `input.value` / `output.value` are
# on every span (the decorator), so they are listed once here, not per span.
content_keys:
  - input.value
  - output.value
  - rag.question_raw
  - rag.question_standalone
  - rag.variants
  - rag.rejected_answer
  - reranker.query
content_suffixes:
  - .document.content

# The request paths of Part 7. `expected_spans(path)` lists the spans whose `paths` hold it.
paths:
  answered: an answerable question, every stage, one llm.generate
  gate_abstain: an off-topic question, the gate abstains, no context or generation
  smalltalk: a greeting, Stage 11 abstains before retrieval
  repair: the first answer fails a fixed check, two llm.generate spans
  unfaithful: the judge says not supported, the answer is withdrawn
  generate_error: the answer model fails twice, the request errors at llm.generate
  guard_reject: the input guard rejects the question (HTTP 400)
  cache_hit: the semantic answer cache answers after the input guard
  generate_abstain: the answer model abstains or its output stays invalid; the output check stops early

# Attribute catalog: the type of every attribute a span may carry, and the sentinel of the ones
# that can be missing. Types: string, int, float, number (int or float), bool, json.
