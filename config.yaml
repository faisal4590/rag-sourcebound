# config.yaml - version 1 defaults
abstain_text: "No information found"

parse:
  header_max_top_pt: 50
  header_font_size_pt: 8
  printed_page_offset: 2         # printed page = PDF page - 2, measured on this edition
  skip_pages: [1, 2, 3, 4, 5, 6, 7, 8, 12, 156, 232]
  rect_min_width_pt: 100         # narrower filled shapes are decoration, not text backgrounds
  glyph_tables:                  # glyph id -> text, for CID fonts whose ToUnicode is wrong (issue #48)
    JetBrainsMono-Regular: src/flp_rag/ingest/glyph_tables/jetbrainsmono-2.221-regular.json
    JetBrainsMono-Italic: src/flp_rag/ingest/glyph_tables/jetbrainsmono-2.221-italic.json
  rect_fills:                    # non-stroking RGB, rounded to 3 decimals, measured on this edition
    code: [0.976, 0.976, 0.976]
    callout: [0.271, 0.188, 0.659]
    highlight: [0.941, 0.973, 1.0]

structure:
  line_tolerance_pt: 2
  paragraph_gap_factor: 1.5
  mono_fonts: ["JetBrainsMono", "IBMPlexMono"]
  heading_font: Staatliches         # spec 2.2 font map
  heading_sizes_pt: [14, 16]        # section headings and callout titles; 16 only in chapter 24
  chapter_title_size_pt: 34
  label_size_pt: 9                  # the "CHAPTER NN" label on opener pages
  label_pattern: '^CHAPTER \d+$'
  mono_char_width_ratio: 0.6        # fallback char width = ratio * font size when unmeasurable
  code_min_gap_chars: 0.5           # words closer than this many chars touch: no space between
  default_mono_size_pt: 9

clean:
  rules_enabled: [nfc, nbsp, zero_width, whitespace, page_number_lines]

chunk:
  tokenizer: cl100k_base
  target_tokens: 350
  min_tokens: 120
  max_tokens: 600
  code_max_tokens: 900
  overlap_paragraph_max_tokens: 80
  parent_max_tokens: 2500

enrich:
  symbols_max: 40
  contextual_summary: false      # Milestone 7
  hypothetical_questions: 0      # Milestone 7

embed:
  model: BAAI/bge-m3
  dim: 1024
  batch_size: 32
  sparse_model: Qdrant/bm25
  cache_path: data/cache/embeddings.sqlite
  retry_attempts: 3              # hosted API calls; local models never fail this way
  retry_backoff_s: 1.0           # doubles per attempt

index:
  qdrant_url: http://localhost:6333
  alias: flp_chunks_current
  keep_previous: 1

verify:
  min_chunks_per_page: 0.5
  smoke_queries: eval/smoke_queries.jsonl

api:
  port: 8000
  timeout_s: 20

guard:
  max_chars: 2000
  rate_limit_per_min: 30

query:
  history_turns: 3
  expansions: 3
  smalltalk_policy: abstain      # abstain | greet
  decompose: false
  hyde: false
  model: <small-model-name>

retrieval:
  top_k_dense: 30
  top_k_sparse: 30
  rrf_k: 60
  top_k_fused: 30

rerank:
  model: BAAI/bge-reranker-v2-m3
  top_n: 8
  batch_size: 16

gate:
  tau_low: 0.20                  # recalibrate with Section 8.4
  tau_pass: 0.35
  tau_high: 0.60

context:
  max_tokens: 6000
  max_blocks: 8
  order: position                # position | sandwich

gen:
  model: <generator-model-name>
  temperature: 0
  max_output_tokens: 800
  prompt_file: prompts/answer_v1.md
  strict_prompt_file: prompts/answer_strict_v1.md

output:
  faithfulness_sample_rate: 0.2
  code_verbatim: true
  judge_model: <small-model-name>

feedback:
  enabled: true                  # Stage 18: CLI keypress and POST /feedback

cache:
  semantic_enabled: false        # Milestone 7
  similarity_threshold: 0.97
  ttl_hours: 168

trace:
  exporter_endpoint: http://localhost:6006/v1/traces
  capture_content: true
  retention_days: 30
  content_max_chars: 20000       # input.value / output.value cap per span
  attr_string_max_chars: 1000    # string attribute cap, spec 7.6
  export_timeout_s: 10           # OTLP export timeout; bounds shutdown when Phoenix is down

prices_usd_per_million_tokens:
  <generator-model-name>: { input: 0.0, output: 0.0 }
  <small-model-name>: { input: 0.0, output: 0.0 }
