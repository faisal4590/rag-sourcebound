[project]
name = "flp-rag"
version = "0.1.0"
description = "Question answering over the book Front Line PHP with a traced, evaluated RAG pipeline"
requires-python = ">=3.12"
dependencies = [
  # pipeline graph and LangChain components
  "langgraph",
  "langchain-core",
  "langchain-anthropic",
  "langchain-openai",
  "langchain-ollama",
  "langchain-huggingface",
  "langchain-qdrant",
  "sentence-transformers",
  "fastembed",
  "qdrant-client",
  # ingestion
  "pdfplumber",
  "tiktoken",
  # configuration and contracts
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  # api and cli
  "fastapi",
  "uvicorn",
  "typer",
  # tracing and logs
  "arize-phoenix-otel",
  "openinference-instrumentation-langchain",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "structlog",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
local = ["arize-phoenix"]   # Phoenix server for `make up-local` (no Docker)
eval = ["ragas"]

[project.scripts]
flp = "flp_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flp_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
