[project]
name = "flp-rag"
version = "0.1.0"
description = "Question answering over the book Front Line PHP with a traced, evaluated RAG pipeline"
requires-python = ">=3.12"
dependencies = [
  # pipeline graph and LangChain components
  "langgraph",
  "langchain-core",
  "langchain-anthropic",
  "langchain-openai",
  "langchain-ollama",
  "langchain-huggingface",
  "langchain-qdrant",
  "sentence-transformers",
  "fastembed",
  "qdrant-client",
  # ingestion
  "pdfplumber",
  "tiktoken",
  # configuration and contracts
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  # api and cli
  "fastapi",
  "uvicorn",
  "typer",
  # tracing and logs
  "arize-phoenix-otel",
  "openinference-instrumentation-langchain",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "structlog",
  "pyarrow>=25.0.1",
  "numpy>=2.5.3",
  "py3langid>=0.4.0,<0.5",  # bundled model pinned by minor version
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pymupdf"]   # pymupdf: glyph oracle in tests/test_glyph_oracle.py, never the parser
local = ["arize-phoenix"]   # Phoenix server for `make up-local` (no Docker)
tools = ["fonttools"]        # tools/build_glyph_table.py
eval = ["ragas", "rank-bm25", "langchain-text-splitters"]   # eval/chunk_retrieval.py: BM25 and the splitter baseline

[project.scripts]
flp = "flp_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flp_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not slow'"
markers = [
    "live: needs the running Qdrant alias with the current index; run with `pytest -m live`",
    "slow: takes about a minute on the real book; run with `pytest -m slow`",
]
